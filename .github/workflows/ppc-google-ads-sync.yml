name: PPC Google Ads Sync

# Daily scheduled sync is currently handled by the PPC Ads Sync automation.
# Keep this workflow manual until WINDSOR_API_KEY, SUPABASE_URL and
# SUPABASE_SERVICE_ROLE_KEY are configured as GitHub Actions repository secrets.
on:
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Optional YYYY-MM-DD dashboard as-of date"
        required: false
        type: string
      backfill_days:
        description: "How many recent as-of dates to refresh"
        required: false
        default: "7"
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PPC_TIME_ZONE: Europe/Budapest
      PPC_AS_OF_DATE: ${{ inputs.as_of_date }}
      PPC_BACKFILL_DAYS: ${{ inputs.backfill_days || '7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WINDSOR_API_KEY"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Sync Google Ads dashboard snapshots
        run: node scripts/sync-ppc-google-ads.mjs
